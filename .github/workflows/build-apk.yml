name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Nastavitev Bun
        uses: oven-sh/setup-bun@v2

      - name: Namestitev odvisnosti
        run: bun install

      - name: Prevajanje spletne aplikacije (Build)
        run: bun run build

      - name: Nastavitev Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Capacitor Sync (Priprava Android kode)
        run: |
          mkdir -p dist/client
          npx cap add android || true
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Gradnja APK datoteke z Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Naloži ustvarjen APK
        uses: actions/upload-artifact@v4
        with:
          name: Xtream-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
