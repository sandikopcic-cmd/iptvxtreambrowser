name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nastavitev Bun
        uses: oven-sh/setup-bun@v1

      - name: Namestitev odvisnosti
        run: bun install

      - name: Prevajanje spletne aplikacije (Build)
        run: bun run build

      - name: Nastavitev Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Capacitor Sync (Priprava Android kode)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Gradnja APK datoteke z Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Naloži ustvarjen APK
        uses: actions/upload-artifact@v4
        with:
          name: Xtream-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
